<h3>点进文本框 → Ctrl+A 全选 → Ctrl+C 复制</h3>
<div class="box"><label>[6] 点进框内按 Ctrl+A 全选复制</label><textarea readonly rows="3">他职业生涯15个赛季，薪水总计约9400万美元，不到1亿。其中最后两年在公牛，1996-97赛季3014万、1997-98赛季3314万——当时全联盟都惊掉了下巴，老板们私下抱怨：一个人凭什么拿走全队一半的工资。</textarea></div>
<div class="box"><label>[7] 点进框内按 Ctrl+A 全选复制</label><textarea readonly rows="2">但横向比比呢？如今的顶薪球员，一年薪水就超过5500万美元。乔丹整个职业生涯的薪水，顶不上现在一个顶薪球员两年的工资。</textarea></div>
<div class="box"><label>[8] 点进框内按 Ctrl+A 全选复制</label><textarea readonly rows="2">真正让乔丹成为亿万富翁的，从来不是篮球本身。</textarea></div>
<div class="box"><label>[9] 点进框内按 Ctrl+A 全选复制</label><textarea readonly rows="2">打球决定了他的起点，但没决定他的终点。</textarea></div>
<div class="box"><label>[10] 点进框内按 Ctrl+A 全选复制</label><textarea readonly rows="2">02 1984年，耐克那场“疯了”的赌局</textarea></div>
<div class="box"><label>[11] 点进框内按 Ctrl+A 全选复制</label><textarea readonly rows="2">1984年，乔丹还是个新秀。耐克找到他，开出一份当时看来“疯了”的合同：5年250万美元，专门为他打造一条球鞋线。</textarea></div>
<div class="box"><label>[12] 点进框内按 Ctrl+A 全选复制</label><textarea readonly rows="2">要知道，当时耐克在篮球鞋市场根本排不上号，阿迪达斯和匡威才是老大。耐克内部很多人反对：把宝押在一个新秀身上，万一水了呢？</textarea></div>
<div class="box"><label>[13] 点进框内按 Ctrl+A 全选复制</label><textarea readonly rows="2">关键时刻，乔丹的母亲坚持加了一条“分红条款”——每卖出一双AJ，乔丹参与抽成。这条后来成了体育史上最值钱的一句话。</textarea></div>
<div class="box"><label>[14] 点进框内按 Ctrl+A 全选复制</label><textarea readonly rows="2">如今AJ品牌年收入超过65亿美元。乔丹每年从耐克拿到的分红，约1.5亿美元。也就是说，</textarea></div>
<div class="box"><label>[15] 点进框内按 Ctrl+A 全选复制</label><textarea readonly rows="2">他退役20多年，每年“躺赚”的钱，是他打球时年薪的5倍。</textarea></div>
<div class="box"><label>[16] 点进框内按 Ctrl+A 全选复制</label><textarea readonly rows="2">他母亲当年多要的那一条分红，顶得上他整个职业生涯的薪水。</textarea></div>
<div class="box"><label>[17] 点进框内按 Ctrl+A 全选复制</label><textarea readonly rows="2">03 2.75亿买进，30亿卖出</textarea></div>
<div class="box"><label>[18] 点进框内按 Ctrl+A 全选复制</label><textarea readonly rows="2">2010年，乔丹花约2.75亿美元，买下夏洛特山猫队（后改名黄蜂）的大部分股权，成为NBA历史上第一位前球员老板。</textarea></div>
<div class="box"><label>[19] 点进框内按 Ctrl+A 全选复制</label><textarea readonly rows="2">当时很多人等着看笑话：打球厉害的人，做生意可不一定行。而黄蜂队战绩常年摆烂，确实没拿过总冠军。</textarea></div>
<div class="box"><label>[20] 点进框内按 Ctrl+A 全选复制</label><textarea readonly rows="2">但2023年，乔丹以约30亿美元的估值，卖掉了大部分股权。13年，10倍。</textarea></div>
<div class="box"><label>[21] 点进框内按 Ctrl+A 全选复制</label><textarea readonly rows="2">他当老板没赢过总冠军，但当商人，他赢麻了。</textarea></div>
<div class="box"><label>[22] 点进框内按 Ctrl+A 全选复制</label><textarea readonly rows="2">球场上他赢的是比赛，球场下他赢的是时间。</textarea></div>
<div class="box"><label>[23] 点进框内按 Ctrl+A 全选复制</label><textarea readonly rows="2">04 为什么只有他是例外？</textarea></div>
<div class="box"><label>[24] 点进框内按 Ctrl+A 全选复制</label><textarea readonly rows="3">美国体育圈有个词叫“退役即破产”：据统计，约六成的NBA球员在退役五年内陷入财务困境。艾弗森、坎普——乔丹身边的人，多少都栽过跟头。就连他最亲密的战友皮蓬，职业生涯薪水超过1亿美元，退役后也传出过财务危机。</textarea></div>
<div class="box"><label>[25] 点进框内按 Ctrl+A 全选复制</label><textarea readonly rows="2">乔丹呢？卖掉球队后，身价约30亿美元，是极少数身价超200亿人民币的运动员。</textarea></div>
<div class="box"><label>[26] 点进框内按 Ctrl+A 全选复制</label><textarea readonly rows="2">差别在哪？三点。</textarea></div>
<div class="box"><label>[27] 点进框内按 Ctrl+A 全选复制</label><textarea readonly rows="2">第一，</textarea></div>
<div class="box"><label>[28] 点进框内按 Ctrl+A 全选复制</label><textarea readonly rows="2">他把“自己”做成了品牌</textarea></div>
<div class="box"><label>[29] 点进框内按 Ctrl+A 全选复制</label><textarea readonly rows="2">。AJ不是一双鞋，是一个符号。球员会退役，符号不会。</textarea></div>
<div class="box"><label>[30] 点进框内按 Ctrl+A 全选复制</label><textarea readonly rows="2">第二，</textarea></div>
<div class="box"><label>[31] 点进框内按 Ctrl+A 全选复制</label><textarea readonly rows="2">他敢在所有人反对时下注</textarea></div>
<div class="box"><label>[32] 点进框内按 Ctrl+A 全选复制</label><textarea readonly rows="2">。1984年签耐克、2010年买球队，两次都是“疯了”的决定。</textarea></div>
<div class="box"><label>[33] 点进框内按 Ctrl+A 全选复制</label><textarea readonly rows="2">第三，</textarea></div>
<div class="box"><label>[34] 点进框内按 Ctrl+A 全选复制</label><textarea readonly rows="2">他从不赚快钱</textarea></div>
<div class="box"><label>[35] 点进框内按 Ctrl+A 全选复制</label><textarea readonly rows="2">。AJ分红拿了40年，球队拿了13年。时间是他最好的队友。</textarea></div>
<div class="box"><label>[36] 点进框内按 Ctrl+A 全选复制</label><textarea readonly rows="2">快钱是工资，慢钱才是身家。</textarea></div>
<div class="box"><label>[37] 点进框内按 Ctrl+A 全选复制</label><textarea readonly rows="2">结语</textarea></div>
<div class="box"><label>[38] 点进框内按 Ctrl+A 全选复制</label><textarea readonly rows="2">我们看他打球时，他在为下一份工资拼命；我们到中年了，他在数钱。这中间差的不是天赋，是四十年前他母亲坚持的那条分红条款里藏着的东西：</textarea></div>
<div class="box"><label>[39] 点进框内按 Ctrl+A 全选复制</label><textarea readonly rows="2">别只出卖时间，要拥有资产。</textarea></div>
<div class="box"><label>[40] 点进框内按 Ctrl+A 全选复制</label><textarea readonly rows="2">工资是别人定的，资产是自己的。这个道理，球场内外都一样。</textarea></div>
<div class="box"><label>[41] 点进框内按 Ctrl+A 全选复制</label><textarea readonly rows="2">打球赚的是工资，拥有赚的才是人生。</textarea></div>
<div class="box"><label>[42] 点进框内按 Ctrl+A 全选复制</label><textarea readonly rows="2">你是因为哪一场比赛喜欢上乔丹的？欢迎在评论区聊聊。</textarea></div>
<div class="box"><label>[43] 点进框内按 Ctrl+A 全选复制</label><textarea readonly rows="2">关注“徐静雨娜场雨”，每天一篇商业人物深扒，看看钱到底是怎么赚的。</textarea></div>
